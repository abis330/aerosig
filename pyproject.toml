[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosig"
version = "0.1.0"
description = "Self-supervised cross-channel Transformer for flight-telemetry fault detection and fault-signature retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "flightlake @ git+https://github.com//flightlake.git",
  "torch>=2.2", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "typer>=0.12",
  "fastapi>=0.110", "uvicorn>=0.29",
]

[project.optional-dependencies]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
aerosig = "aerosig.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
markers = ["slow: trains a tiny model on a simulated fleet (~1 min)"]
